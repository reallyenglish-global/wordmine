name: Signed Android release artifacts (build only)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unused positive Play versionCode (owner must check Play history)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wordmine-android-signing
  cancel-in-progress: false

jobs:
  unsigned-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      # Dispatch inputs are passed as data, never interpolated into shell code.
      WORDMINE_ANDROID_RELEASE_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run typecheck && npm test && npm run contract:check
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Exercise real archive-signature security regression tests
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools build-tools;36.0.0 cmdline-tools;latest
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Generate permanent-identity release project and remove template debug signing
        run: |
          npx expo prebuild --platform android --no-install
          node scripts/strip-debug-release-signing.mjs android/app/build.gradle
      - name: Compile release APK and AAB without template signing
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Validate bundle and extract manifest
        run: |
          android/gradlew -p scripts/aab-validator verifyAab dumpManifest -Paab="$GITHUB_WORKSPACE/android/app/build/outputs/bundle/release/app-release.aab" -Pmanifest="$RUNNER_TEMP/aab-manifest.xml" --project-cache-dir "$RUNNER_TEMP/aab-validator" --no-daemon --console=plain
          node scripts/android-release.mjs "$RUNNER_TEMP/aab-manifest.xml" "$WORDMINE_ANDROID_RELEASE_VERSION_CODE"
      - name: Stage unsigned inputs (never private signing material)
        run: |
          mkdir -p unsigned-artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab unsigned-artifacts/app-release.aab
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned-artifacts/app-release-unsigned.apk
          cp "$RUNNER_TEMP/aab-manifest.xml" unsigned-artifacts/aab-manifest.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordmine-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: unsigned-artifacts/
          if-no-files-found: error
          retention-days: 1

  signed-artifacts:
    needs: unsigned-build
    if: github.ref == 'refs/heads/main'
    # Separate fresh VM: no npm, Expo, Gradle, build output execution or caches here.
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORDMINE_ANDROID_RELEASE_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools build-tools;36.0.0 cmdline-tools;latest
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wordmine-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: unsigned-artifacts/
      - name: Fetch independently pinned bundletool
        run: curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
      - name: Independently inspect actual bundle before secrets enter scope
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          python3 scripts/verify-play-artifact.py unsigned-artifacts/app-release.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --package com.reallyenglish.wordmine --version-code "$WORDMINE_ANDROID_RELEASE_VERSION_CODE" --version-name "$VERSION" --output release-artifacts
      - name: Sign artifacts and verify expected upload certificate
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_CERTIFICATE_PEM: ${{ secrets.ANDROID_UPLOAD_CERTIFICATE_PEM }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$(mktemp -d "$RUNNER_TEMP/wordmine-signing.XXXXXX")"
          export KEY_DIR
          trap 'rm -rf "$KEY_DIR"' EXIT
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path(os.environ['KEY_DIR'])
          for name in ['ANDROID_UPLOAD_KEYSTORE_BASE64','ANDROID_UPLOAD_STORE_PASSWORD','ANDROID_UPLOAD_KEY_PASSWORD','ANDROID_UPLOAD_KEY_ALIAS','ANDROID_UPLOAD_CERTIFICATE_PEM']:
              if not os.environ.get(name): raise SystemExit('Missing required signing secret: '+name)
          (p/'upload.p12').write_bytes(base64.b64decode(os.environ['ANDROID_UPLOAD_KEYSTORE_BASE64'], validate=True))
          (p/'expected.pem').write_text(os.environ['ANDROID_UPLOAD_CERTIFICATE_PEM'])
          PY
          keytool -exportcert -rfc -keystore "$KEY_DIR/upload.p12" -storepass:env ANDROID_UPLOAD_STORE_PASSWORD -alias "$ANDROID_UPLOAD_KEY_ALIAS" -file "$KEY_DIR/actual.pem"
          openssl x509 -in "$KEY_DIR/expected.pem" -outform DER -out "$KEY_DIR/expected.der"
          openssl x509 -in "$KEY_DIR/actual.pem" -outform DER -out "$KEY_DIR/actual.der"
          cmp "$KEY_DIR/expected.der" "$KEY_DIR/actual.der"
          EXPECTED="$(sha256sum "$KEY_DIR/expected.der" | cut -d' ' -f1)"
          mkdir -p release-artifacts
          cp unsigned-artifacts/app-release.aab release-artifacts/wordmine-release.aab
          jarsigner -keystore "$KEY_DIR/upload.p12" -storepass:env ANDROID_UPLOAD_STORE_PASSWORD -keypass:env ANDROID_UPLOAD_KEY_PASSWORD release-artifacts/wordmine-release.aab "$ANDROID_UPLOAD_KEY_ALIAS"
          python3 scripts/verify-aab-signature.py release-artifacts/wordmine-release.aab "$KEY_DIR/upload.p12"
          keytool -printcert -jarfile release-artifacts/wordmine-release.aab -rfc > "$KEY_DIR/aab-signer.pem"
          openssl x509 -in "$KEY_DIR/aab-signer.pem" -outform DER -out "$KEY_DIR/aab-signer.der"
          cmp "$KEY_DIR/expected.der" "$KEY_DIR/aab-signer.der"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -P 16 -f 4 unsigned-artifacts/app-release-unsigned.apk "$KEY_DIR/aligned.apk"
          "$BT/apksigner" sign --ks "$KEY_DIR/upload.p12" --ks-key-alias "$ANDROID_UPLOAD_KEY_ALIAS" --ks-pass env:ANDROID_UPLOAD_STORE_PASSWORD --key-pass env:ANDROID_UPLOAD_KEY_PASSWORD --out release-artifacts/wordmine-release.apk "$KEY_DIR/aligned.apk"
          "$BT/zipalign" -c -P 16 4 release-artifacts/wordmine-release.apk
          "$BT/apksigner" verify --verbose --print-certs release-artifacts/wordmine-release.apk > release-artifacts/apk-signature.txt
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release-artifacts/apk-signature.txt)"
          test "$EXPECTED" = "$ACTUAL"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print release-artifacts/wordmine-release.apk > release-artifacts/apk-manifest.xml
          cp "$KEY_DIR/expected.pem" release-artifacts/upload-certificate.pem
          printf 'sourceSha=%s\nversionCode=%s\nuploadCertificateSha256=%s\n' "$GITHUB_SHA" "$WORDMINE_ANDROID_RELEASE_VERSION_CODE" "$EXPECTED" > release-artifacts/provenance.txt
          (cd release-artifacts && sha256sum wordmine-release.aab wordmine-release.apk > SHA256SUMS)
      - name: Verify final signed AAB bytes and APK manifest (no secrets in scope)
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          python3 scripts/verify-play-artifact.py release-artifacts/wordmine-release.aab --bundletool "$RUNNER_TEMP/bundletool.jar" --package com.reallyenglish.wordmine --version-code "$WORDMINE_ANDROID_RELEASE_VERSION_CODE" --version-name "$VERSION" --output release-artifacts --apk-manifest release-artifacts/apk-manifest.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordmine-signed-android-${{ inputs.version_code }}-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
