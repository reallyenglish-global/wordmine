name: Contract checks and Android prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract:check

  android-prototype:
    # The debug APK is a 40 to 50 minute build; pull requests only need the contract job.
    if: github.event_name != 'pull_request'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Compile prototype APK (not a release)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Checksum APK
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > wordmine-prototype.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wordmine-android-prototype-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            wordmine-prototype.sha256
          if-no-files-found: error
          retention-days: 7
