name: Contract checks and Android prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract:check

  web-pwa:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - name: Exercise study, persistence and offline reload in Chromium
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordmine-web-acceptance-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  native-bundles:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check Android and iOS production JS and Hermes bundling (not device tests)
        run: npx expo export --platform android --platform ios --output-dir dist-native
        env:
          CI: '1'

  android-prototype:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: npm ci
      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Compile prototype APK (not a release)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Checksum APK
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > wordmine-prototype.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wordmine-android-prototype-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            wordmine-prototype.sha256
          if-no-files-found: error
          retention-days: 7
