name: Contract checks and Android prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract:check

  web-pwa:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - name: Exercise study, persistence and offline reload in Chromium
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordmine-web-acceptance-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  native-bundles:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check Android and iOS production JS and Hermes bundling (not device tests)
        run: npx expo export --platform android --platform ios --output-dir dist-native
        env:
          CI: '1'

  android-preview:
    # Non-debug preview artifact for PR/manual acceptance; no signing secrets or upload destination.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --no-install
      - name: Compile non-debug preview APK (prototype identity; not store-signed)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Sign preview APK with a disposable CI-only key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/wordmine-preview.jks" -storepass preview-only -keypass preview-only -alias preview -keyalg RSA -keysize 2048 -validity 2 -dname "CN=WordMine Preview, OU=CI, O=WordMine, C=GB"
          apksigner sign --ks "$RUNNER_TEMP/wordmine-preview.jks" --ks-pass pass:preview-only --key-pass pass:preview-only --out "$RUNNER_TEMP/wordmine-preview-signed.apk" android/app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose "$RUNNER_TEMP/wordmine-preview-signed.apk"
      - name: Record preview provenance
        run: |
          mkdir -p preview
          cp "$RUNNER_TEMP/wordmine-preview-signed.apk" preview/wordmine-preview.apk
          sha256sum preview/wordmine-preview.apk > preview/sha256.txt
          git rev-parse HEAD > preview/source-sha.txt
          node -e 'const c=require("./app.json").expo; require("fs").writeFileSync("preview/build-metadata.json", JSON.stringify({applicationId:c.android.package, version:c.version, androidVersionCode:c.android.versionCode??null, variant:"release", signing:"disposable CI-only preview key; not for store updates"},null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: wordmine-preview-${{ github.sha }}
          path: preview/
          if-no-files-found: error
          retention-days: 7

  android-prototype:
    # Preserve the existing main-branch debug-prototype behavior.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Compile prototype APK (not a release)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Checksum APK
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > wordmine-prototype.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wordmine-android-prototype-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            wordmine-prototype.sha256
          if-no-files-found: error
          retention-days: 7

  native-android-runtime:
    # Manual acceptance installs the exact checksum-verified preview artifact.
    if: github.event_name == 'workflow_dispatch'
    needs: android-preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: wordmine-preview-${{ github.sha }}
          path: preview/
      - name: Verify preview checksum and stage emulator input
        run: |
          sha256sum --check preview/sha256.txt
          mkdir -p native-results
          cp preview/wordmine-preview.apk native-results/wordmine-emulator.apk
          cp preview/sha256.txt native-results/android.sha256
          cp preview/source-sha.txt native-results/source-sha.txt
      - run: bash scripts/ci/install-maestro.sh
      - name: Enable KVM for the disposable hosted emulator
        run: |
          sudo chmod 666 /dev/kvm
      - name: Install and exercise the exact preview APK without Metro
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/ci/android-runtime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordmine-android-runtime-${{ github.sha }}
          overwrite: true
          path: native-results/
          if-no-files-found: error
          retention-days: 7

  native-ios-simulator:
    if: github.event_name == 'workflow_dispatch'
    needs: contracts
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: '1'
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - name: Install simulator Pods
        working-directory: ios
        run: pod install
      - run: bash scripts/ci/install-maestro.sh
      - name: Compile, install and exercise unsigned Release simulator app
        run: bash scripts/ci/ios-simulator.sh
      - name: Record exact source revision
        if: always()
        run: |
          mkdir -p native-results
          git rev-parse HEAD > native-results/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordmine-ios-simulator-${{ github.sha }}
          overwrite: true
          path: native-results/
          if-no-files-found: error
          retention-days: 7
