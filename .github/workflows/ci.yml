name: Contract checks and Android prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run contract:check

  android-prototype:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Compile prototype APK (not a release)
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Checksum APK
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > wordmine-prototype.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wordmine-android-prototype-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            wordmine-prototype.sha256
          if-no-files-found: error
          retention-days: 7
