appId: com.reallyenglish.wordmine.prototype
name: Reveal a known element from a stable screen anchor
---
- scrollUntilVisible:
    element:
      text: ${ANCHOR}
    direction: UP
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ${TARGET}
    direction: DOWN
    timeout: 20000
    # Footer/status targets may be fully visible without enough content below
    # to move into Maestro's centre band. Require visibility, not positioning.
    visibilityPercentage: 100
    centerElement: false
